---
name: Guard Main Branch

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - auto_merge_enabled
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  guardian-jobs:
    uses: ec-intl/.github/.github/workflows/guard_template.yml@v1.0.0
    secrets: inherit
